<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>a little something for you ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    :root {
      --primary-pink: #ff4d6d;
      --soft-pink: #ffb3c6;
      --deep-rose: #b3406c;
      --cream: #fff5f7;
      --glass: rgba(255, 255, 255, 0.7);
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #f9c9d6 0%, #ffdde1 50%, #ffeef2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient floating particles */
    .ambient-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -2;
      background: 
        radial-gradient(circle at 20% 80%, rgba(255, 200, 220, 0.4) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255, 180, 200, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(255, 220, 230, 0.5) 0%, transparent 40%);
    }

    /* Glassmorphism card */
    .valentine-card {
      max-width: 850px;
      width: 100%;
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 40px;
      box-shadow: 
        0 30px 60px -15px rgba(250, 100, 150, 0.3),
        0 0 0 1px rgba(255, 255, 255, 0.8) inset,
        0 0 100px rgba(255, 200, 220, 0.3) inset;
      padding: 50px 40px 60px;
      text-align: center;
      position: relative;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.9);
      animation: cardFloat 6s ease-in-out infinite;
    }

    @keyframes cardFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    /* Shimmer effect on card */
    .valentine-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        45deg,
        transparent 30%,
        rgba(255, 255, 255, 0.3) 50%,
        transparent 70%
      );
      animation: shimmer 8s infinite;
      pointer-events: none;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%) rotate(45deg); }
      100% { transform: translateX(100%) rotate(45deg); }
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 4rem;
      font-weight: 700;
      background: linear-gradient(135deg, #b3406c, #d45e8b, #ff8eb5, #ff4d6d);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 15px;
      letter-spacing: -1px;
      animation: gradientShift 4s ease infinite;
      position: relative;
      z-index: 1;
      text-shadow: 0 5px 15px rgba(255, 150, 200, 0.2);
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .sub {
      font-size: 1.3rem;
      color: #a64d79;
      margin-bottom: 35px;
      font-weight: 300;
      background: rgba(255, 220, 240, 0.8);
      display: inline-block;
      padding: 10px 28px;
      border-radius: 50px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(255, 180, 200, 0.3);
      position: relative;
      z-index: 1;
    }

    .envelope-icon {
      font-size: 3.5rem;
      margin: 20px 0;
      display: inline-block;
      animation: envelopeFloat 3s ease-in-out infinite;
      filter: drop-shadow(0 10px 20px rgba(255, 150, 180, 0.4));
      cursor: pointer;
      transition: transform 0.3s;
    }

    .envelope-icon:hover {
      transform: scale(1.2) rotate(10deg);
    }

    @keyframes envelopeFloat {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-15px) rotate(5deg); }
    }

    .question {
      font-size: 2.2rem;
      font-weight: 500;
      color: #773d54;
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
      text-shadow: 0 2px 10px rgba(255, 200, 220, 0.5);
    }

    .sub-question {
      color: #b85c7c;
      margin-bottom: 30px;
      font-size: 1.1rem;
      font-weight: 300;
      position: relative;
      z-index: 1;
    }

    /* Button container with 3D perspective */
    .button-pair {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      flex-wrap: wrap;
      margin: 40px 0 30px;
      position: relative;
      z-index: 10;
      perspective: 1000px;
    }

    /* YES Button - Ultimate styling */
    .yes-btn {
      background: linear-gradient(135deg, #ff4d6d 0%, #ff6b8a 100%);
      color: white;
      border: none;
      padding: 20px 60px;
      font-size: 2rem;
      font-weight: 700;
      border-radius: 60px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 
        0 20px 40px -10px rgba(255, 77, 109, 0.5),
        0 0 0 4px rgba(255, 255, 255, 0.3) inset,
        0 5px 0 0 #c41e3a;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: 2px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      transform-style: preserve-3d;
    }

    .yes-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      transition: left 0.5s;
    }

    .yes-btn:hover::before {
      left: 100%;
    }

    .yes-btn:hover {
      transform: translateY(-5px) scale(1.05) rotateX(10deg);
      box-shadow: 
        0 30px 50px -10px rgba(255, 77, 109, 0.6),
        0 0 0 4px rgba(255, 255, 255, 0.5) inset,
        0 8px 0 0 #c41e3a;
    }

    .yes-btn:active {
      transform: translateY(2px) scale(0.98);
      box-shadow: 
        0 10px 20px -10px rgba(255, 77, 109, 0.4),
        0 0 0 4px rgba(255, 255, 255, 0.3) inset,
        0 2px 0 0 #c41e3a;
    }

    /* Pulse animation for yes button */
    .yes-btn.pulse {
      animation: btnPulse 2s infinite;
    }

    @keyframes btnPulse {
      0%, 100% { box-shadow: 0 20px 40px -10px rgba(255, 77, 109, 0.5), 0 0 0 4px rgba(255, 255, 255, 0.3) inset, 0 0 0 0 rgba(255, 77, 109, 0.4); }
      50% { box-shadow: 0 20px 40px -10px rgba(255, 77, 109, 0.5), 0 0 0 4px rgba(255, 255, 255, 0.3) inset, 0 0 0 20px rgba(255, 77, 109, 0); }
    }

    /* NO Button - Playful elusive styling */
    .no-btn {
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      color: #6c757d;
      border: 3px solid #ffb3c6;
      padding: 16px 45px;
      font-size: 1.6rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      position: relative;
      box-shadow: 
        0 10px 25px -5px rgba(0, 0, 0, 0.1),
        0 4px 0 0 #dee2e6;
      transition: all 0.2s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      transform-style: preserve-3d;
    }

    .no-btn:hover {
      background: linear-gradient(135deg, #ffe2e8 0%, #ffd1dc 100%);
      color: #a15c6e;
      border-color: #ff9eb5;
      transform: scale(1.05);
    }

    .no-btn:active {
      transform: scale(0.95);
      box-shadow: 0 5px 15px -5px rgba(0, 0, 0, 0.1), 0 2px 0 0 #dee2e6;
    }

    /* Surprise section */
    .surprise-box {
      margin-top: 40px;
      opacity: 0;
      transform: translateY(30px) scale(0.95);
      transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      position: relative;
      z-index: 1;
    }

    .surprise-box.reveal {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    /* Love letter with paper texture */
    .love-message {
      background: 
        linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 245, 247, 0.9) 100%);
      backdrop-filter: blur(15px);
      padding: 40px 35px;
      border-radius: 30px;
      font-size: 1.3rem;
      line-height: 2;
      color: #552e3c;
      text-align: left;
      white-space: pre-line;
      box-shadow: 
        0 20px 40px rgba(255, 190, 200, 0.4),
        0 0 0 1px rgba(255, 255, 255, 0.9) inset;
      margin: 30px 0;
      border: 2px solid rgba(255, 255, 255, 0.9);
      position: relative;
      font-family: 'Poppins', sans-serif;
      max-height: 400px;
      overflow-y: auto;
    }

    /* Custom scrollbar for letter */
    .love-message::-webkit-scrollbar {
      width: 8px;
    }

    .love-message::-webkit-scrollbar-track {
      background: rgba(255, 200, 220, 0.2);
      border-radius: 10px;
    }

    .love-message::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, #ffb3c6, #ff8eb5);
      border-radius: 10px;
    }

    /* Decorative quote marks */
    .love-message::before {
      content: '"';
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 5rem;
      color: rgba(255, 179, 198, 0.3);
      font-family: serif;
      line-height: 1;
      pointer-events: none;
    }

    /* GIF Gallery */
    .gif-gallery {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
      margin: 40px 0;
      perspective: 1000px;
    }

    .gif-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      transition: transform 0.3s;
      cursor: pointer;
    }

    .gif-item:hover {
      transform: translateY(-10px);
    }

    .gif-label {
      font-size: 1.3rem;
      color: #a14b6e;
      background: rgba(255, 255, 240, 0.9);
      padding: 8px 20px;
      border-radius: 50px;
      backdrop-filter: blur(5px);
      font-weight: 500;
      box-shadow: 0 4px 15px rgba(255, 180, 200, 0.3);
      transition: all 0.3s;
    }

    .gif-item:hover .gif-label {
      background: rgba(255, 220, 230, 0.95);
      transform: scale(1.05);
    }

    /* Enhanced GIF styling */
    .bear-img, .hug-bear-img {
      width: 280px;
      max-width: 95%;
      border-radius: 30px;
      box-shadow: 
        0 25px 50px rgba(255, 158, 181, 0.4),
        0 0 0 5px white;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: block;
      position: relative;
    }

    .hug-bear-img {
      width: 300px;
    }

    .bear-img:hover, .hug-bear-img:hover {
      transform: scale(1.08) rotate(2deg);
      box-shadow: 
        0 35px 60px rgba(255, 133, 168, 0.5),
        0 0 0 5px white;
    }

    /* Rose decoration */
    .rose-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 30px 0;
      flex-wrap: wrap;
    }

    .rose-emoji-large {
      font-size: 5rem;
      filter: drop-shadow(0 10px 20px rgba(255, 158, 181, 0.5));
      animation: gentleSway 3s infinite ease-in-out;
      line-height: 1;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .rose-emoji-large:hover {
      transform: scale(1.3) rotate(15deg);
      filter: drop-shadow(0 15px 30px rgba(255, 100, 150, 0.6));
    }

    .rose-emoji-large:nth-child(2) { animation-delay: 0.5s; }
    .rose-emoji-large:nth-child(3) { animation-delay: 1s; }

    @keyframes gentleSway {
      0%, 100% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(8deg) scale(1.1); }
    }

    .success-message {
      font-size: 1.8rem;
      color: #ab4f71;
      font-weight: 600;
      margin-top: 20px;
      text-shadow: 0 2px 10px rgba(255, 200, 220, 0.5);
      animation: fadeInUp 1s ease;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hint-text {
      font-size: 1.1rem;
      color: #b36b7e;
      margin-top: 25px;
      opacity: 0.8;
      font-style: italic;
      position: relative;
      z-index: 1;
      transition: opacity 0.3s;
    }

    /* Music Player */
    .music-control {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 50%;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 100, 150, 0.3);
      border: 2px solid rgba(255, 200, 220, 0.5);
      transition: all 0.3s;
      font-size: 1.8rem;
    }

    .music-control:hover {
      transform: scale(1.1);
      box-shadow: 0 15px 40px rgba(255, 100, 150, 0.4);
    }

    .music-control.playing {
      animation: musicPulse 2s infinite;
    }

    @keyframes musicPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 100, 150, 0.4); }
      50% { box-shadow: 0 0 0 15px rgba(255, 100, 150, 0); }
    }

    /* Volume slider */
    .volume-control {
      position: fixed;
      bottom: 100px;
      right: 30px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      padding: 15px;
      border-radius: 30px;
      box-shadow: 0 10px 30px rgba(255, 100, 150, 0.2);
      display: none;
      flex-direction: column;
      gap: 10px;
      min-width: 150px;
    }

    .volume-control.show {
      display: flex;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .volume-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 10px;
      background: linear-gradient(90deg, #ffb3c6, #ff4d6d);
      outline: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ff4d6d;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(255, 77, 109, 0.4);
    }

    /* Floating hearts background */
    .heart-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
    }

    .float-heart {
      position: absolute;
      font-size: 24px;
      animation: floatAround 15s linear infinite;
      opacity: 0.6;
      filter: drop-shadow(0 0 10px rgba(255, 150, 180, 0.5));
    }

    @keyframes floatAround {
      0% { 
        transform: translateY(110vh) rotate(0deg) scale(0.5); 
        opacity: 0; 
      }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      100% { 
        transform: translateY(-10vh) rotate(720deg) scale(1.2); 
        opacity: 0; 
      }
    }

    /* Explosion hearts */
    .explode-heart {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      animation: popOut 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      filter: drop-shadow(0 5px 15px rgba(255, 100, 150, 0.5));
    }

    @keyframes popOut {
      0% { transform: scale(0) rotate(0deg); opacity: 1; }
      50% { transform: scale(1.5) rotate(180deg); opacity: 0.8; }
      100% { transform: scale(0) rotate(360deg); opacity: 0; }
    }

    /* Sparkle effect */
    .sparkle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: white;
      border-radius: 50%;
      pointer-events: none;
      animation: sparkleAnim 1s linear forwards;
    }

    @keyframes sparkleAnim {
      0% { transform: scale(0) rotate(0deg); opacity: 1; }
      100% { transform: scale(1) rotate(180deg); opacity: 0; }
    }

    /* Confetti */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -10px;
      pointer-events: none;
      z-index: 9998;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .valentine-card {
        padding: 35px 25px 45px;
        border-radius: 30px;
      }

      h1 { font-size: 3rem; }
      
      .sub { 
        font-size: 1.1rem; 
        padding: 8px 20px;
      }

      .question { font-size: 1.8rem; }
      
      .yes-btn {
        padding: 18px 45px;
        font-size: 1.7rem;
      }

      .no-btn {
        padding: 14px 35px;
        font-size: 1.4rem;
      }

      .bear-img, .hug-bear-img {
        width: 220px;
      }

      .hug-bear-img { width: 240px; }

      .love-message {
        font-size: 1.1rem;
        padding: 30px 25px;
        max-height: 350px;
      }

      .gif-gallery { gap: 25px; }
    }

    @media (max-width: 480px) {
      .valentine-card {
        padding: 30px 20px 40px;
      }

      h1 { font-size: 2.5rem; }
      
      .button-pair { gap: 20px; }
      
      .yes-btn {
        padding: 16px 40px;
        font-size: 1.5rem;
        width: 100%;
        max-width: 280px;
        justify-content: center;
      }

      .no-btn {
        padding: 12px 30px;
        font-size: 1.3rem;
      }

      .bear-img, .hug-bear-img {
        width: 180px;
      }

      .hug-bear-img { width: 200px; }

      .rose-emoji-large { font-size: 3.5rem; }

      .music-control {
        width: 50px;
        height: 50px;
        font-size: 1.5rem;
        bottom: 20px;
        right: 20px;
      }
    }

    /* Touch device optimizations */
    @media (hover: none) {
      .yes-btn:hover { transform: none; }
      .no-btn { transition: transform 0.1s; }
    }

    /* Loading animation */
    .loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #f9c9d6 0%, #ffdde1 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s;
    }

    .loading.hide {
      opacity: 0;
      pointer-events: none;
    }

    .loading-heart {
      font-size: 5rem;
      animation: heartbeat 1.5s infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.1); }
      50% { transform: scale(1); }
      75% { transform: scale(1.1); }
    }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div class="loading" id="loading">
    <div class="loading-heart">💝</div>
  </div>

  <!-- Ambient Background -->
  <div class="ambient-bg"></div>

  <!-- Floating Hearts Background -->
  <div class="heart-bg" id="heartBg"></div>

  <!-- Main Card -->
  <div class="valentine-card" id="mainCard">
    <h1>Heyyy, guess what? 🌸</h1>
    <div class="sub">(something i've been meaning to ask...)</div>

    <div class="envelope-icon" onclick="wiggleEnvelope()">💌</div>
    
    <p class="question">Will you be my Valentine?</p>
    <p class="sub-question">(no pressure, just a hopeful click)</p>

    <div class="button-pair" id="buttonPair">
      <button class="yes-btn pulse" id="yesBtn" onclick="handleYes()">
        <span>Yes</span>
        <span>💖</span>
      </button>
      <button class="no-btn" id="noBtn" onclick="handleNo(event)">No 😅</button>
    </div>

    <!-- Surprise Section -->
    <div class="surprise-box" id="surpriseBox">
      <div class="love-message" id="letterDisplay"></div>

      <div class="gif-gallery">
        <div class="gif-item" onclick="celebrateGif(this)">
          <span class="gif-label">big hug 💞</span>
          <img class="hug-bear-img" src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExNzZ5Z253bnNmejRkb3ZmcHRlZHVpMnZneTd2MGJpdGQ3Nzg1d2ljMyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/Wopg1mZqst26bQYdMK/giphy.gif" alt="hugging bear love" loading="lazy">
        </div>

        <div class="gif-item" onclick="celebrateGif(this)">
          <span class="gif-label">sending love 🌹</span>
          <img class="bear-img" src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExaGs2NW13bnEwa3pkOXN3bHZ1czZveW1uOGs3YjU4cGtvYmxiNjV5biZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/zFHu7yuSHm4H5gNZVx/giphy.gif" alt="teddy bear love" loading="lazy">
        </div>
      </div>

      <div class="rose-container">
        <span class="rose-emoji-large" onclick="roseClick(this)">🌹</span>
        <span class="rose-emoji-large" onclick="roseClick(this)">🌸</span>
        <span class="rose-emoji-large" onclick="roseClick(this)">🌹</span>
      </div>

      <p class="success-message">💘 you just made my day 💘</p>
    </div>

    <p class="hint-text" id="hintMsg">(the "No" button is shy, don't be mad ☁️)</p>
  </div>

  <!-- Music Control -->
  <div class="music-control" id="musicBtn" onclick="toggleMusic()">🎵</div>
  
  <div class="volume-control" id="volumeControl">
    <label style="font-size: 0.9rem; color: #a64d79; font-weight: 500;">Volume</label>
    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="50" oninput="changeVolume(this.value)">
  </div>

  <!-- Audio Elements -->
  <!-- Romantic instrumental music - Using royalty-free sources -->
<audio id="bgMusic" loop preload="auto">
  <!-- Soft Romantic Piano -->
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" type="audio/mpeg">
  <!-- Gentle Piano Dreams -->
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3" type="audio/mpeg">
</audio>

  <script>
    // ===== CONFIGURATION =====
    const CONFIG = {
      message: `Hi there, beautiful soul 💫

I know we don't chat a lot, and this might be a little unexpected,
but I wanted to do something small & genuine for you.

Even though we're miles apart, you always manage to bring a smile to my day.
You seem like someone with a really kind heart, and I'd love to get to know you better —
over a silly Valentine's chat, a coffee when we can, or just some laughs from afar.

So here's my honest question (with a tiny digital rose 🌹):

Will you be my Valentine?
(No pressure — just a chance to connect, even across the distance.)

Either way, I hope today brings you a little joy and a big smile. 💕`,
      typingSpeed: 25,
      heartCount: 60,
      musicVolume: 0.5
    };

    // ===== STATE =====
    let state = {
      yesClicked: false,
      isPlaying: false,
      noClickCount: 0,
      mouseX: 0,
      mouseY: 0
    };

    // ===== DOM ELEMENTS =====
    const elements = {
      yesBtn: document.getElementById('yesBtn'),
      noBtn: document.getElementById('noBtn'),
      surpriseBox: document.getElementById('surpriseBox'),
      letterDisplay: document.getElementById('letterDisplay'),
      hintMsg: document.getElementById('hintMsg'),
      heartBg: document.getElementById('heartBg'),
      mainCard: document.getElementById('mainCard'),
      music: document.getElementById('bgMusic'),
      musicBtn: document.getElementById('musicBtn'),
      volumeControl: document.getElementById('volumeControl'),
      loading: document.getElementById('loading')
    };

    // ===== INITIALIZATION =====
    window.addEventListener('load', () => {
      setTimeout(() => {
        elements.loading.classList.add('hide');
        createBackgroundHearts();
        initMouseTracking();
        initTouchHandling();
      }, 1000);
    });

    // ===== MOUSE TRACKING FOR NO BUTTON =====
    function initMouseTracking() {
      document.addEventListener('mousemove', (e) => {
        state.mouseX = e.clientX;
        state.mouseY = e.clientY;
        
        // Make no button run away on desktop
        if (!state.yesClicked && window.innerWidth > 768) {
          const noRect = elements.noBtn.getBoundingClientRect();
          const noCenterX = noRect.left + noRect.width / 2;
          const noCenterY = noRect.top + noRect.height / 2;
          const distance = Math.hypot(state.mouseX - noCenterX, state.mouseY - noCenterY);
          
          if (distance < 150) {
            escapeNoButton();
          }
        }
      });
    }

    // ===== TOUCH HANDLING =====
    function initTouchHandling() {
      elements.noBtn.addEventListener('touchstart', (e) => {
        if (!state.yesClicked) {
          e.preventDefault();
          escapeNoButton();
        }
      }, { passive: false });
    }

    // ===== NO BUTTON ESCAPE =====
    function escapeNoButton() {
      const card = elements.mainCard.getBoundingClientRect();
      const btn = elements.noBtn.getBoundingClientRect();
      
      const maxX = card.width - btn.width - 40;
      const maxY = card.height - btn.height - 100;
      
      let newX, newY;
      let attempts = 0;
      
      do {
        newX = Math.random() * maxX + 20;
        newY = Math.random() * maxY + 80;
        attempts++;
      } while (attempts < 10);
      
      elements.noBtn.style.position = 'absolute';
      elements.noBtn.style.left = newX + 'px';
      elements.noBtn.style.top = newY + 'px';
      elements.noBtn.style.transition = 'all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
      
      // Add rotation effect
      const rotation = (Math.random() - 0.5) * 30;
      elements.noBtn.style.transform = `rotate(${rotation}deg) scale(0.9)`;
      
      setTimeout(() => {
        elements.noBtn.style.transform = 'rotate(0deg) scale(1)';
      }, 300);
      
      createSparkles(btn.left + btn.width/2, btn.top + btn.height/2);
    }

       // ===== YES BUTTON HANDLER =====
    function handleYes() {
      if (state.yesClicked) return;
      state.yesClicked = true;

      // Visual feedback
      elements.yesBtn.classList.remove('pulse');
      elements.yesBtn.innerHTML = '<span>Yay!</span><span>💘</span>';
      elements.yesBtn.style.background = 'linear-gradient(135deg, #ff2255 0%, #ff4d6d 100%)';
      elements.yesBtn.style.transform = 'scale(1.1)';
      
      // Hide no button
      elements.noBtn.style.opacity = '0';
      elements.noBtn.style.pointerEvents = 'none';
      elements.noBtn.style.transform = 'scale(0)';
      
      // Hide hint
      elements.hintMsg.style.opacity = '0';
      
      // Show surprise
      elements.surpriseBox.classList.add('reveal');
      
      // Start typing
      typeWriter(CONFIG.message, elements.letterDisplay, CONFIG.typingSpeed);
      
      // Explosions
      explodeHearts(CONFIG.heartCount);
      setTimeout(() => explodeHearts(30), 500);
      setTimeout(() => explodeHearts(20), 1000);
      setTimeout(() => createConfetti(), 800);
      
      // Background change
      document.body.style.background = 'linear-gradient(145deg, #ffe2ec 0%, #ffb3d1 50%, #ffc9d6 100%)';
      
      // Auto-play music if not playing
      if (!state.isPlaying) {
        toggleMusic();
      }
      
      // 🌸 REDIRECT TO GARDEN PAGE AFTER 2 MINUTES
      setTimeout(() => {
        window.location.href = 'secret.html';
      }, 25000); // 120 seconds = 2 minutes
    }  // <-- THIS CLOSING BRACE WAS MISSING!

    // ===== NO BUTTON HANDLER =====
    function handleNo(e) {
      if (state.yesClicked) return;
      e.stopPropagation();
      state.noClickCount++;
      
      const messages = [
        "hehe the button ran away! 😋",
        "too slow! try again! 🏃‍♀️",
        "catch me if you can! 🎭",
        "almost had me! 💨",
        "just click Yes already! 💝"
      ];
      
      alert(messages[Math.min(state.noClickCount - 1, messages.length - 1)]);
      escapeNoButton();}
    // ===== TYPEWRITER EFFECT =====
    function typeWriter(text, element, speed) {
      element.innerHTML = '';
      let i = 0;
      
      function type() {
        if (i < text.length) {
          if (text.charAt(i) === '\n') {
            element.innerHTML += '<br>';
          } else {
            element.innerHTML += text.charAt(i);
          }
          i++;
          
          // Scroll to bottom
          element.scrollTop = element.scrollHeight;
          
          setTimeout(type, speed);
        }
      }
      
      type();
    }

    // ===== VISUAL EFFECTS =====
    function explodeHearts(count) {
      const colors = ['💖', '💗', '💓', '💕', '💘', '🌸', '🌺', '💞', '💝', '🌹'];
      
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const heart = document.createElement('div');
          heart.className = 'explode-heart';
          heart.innerHTML = colors[Math.floor(Math.random() * colors.length)];
          
          const startX = Math.random() * window.innerWidth;
          const startY = Math.random() * window.innerHeight;
          
          heart.style.left = startX + 'px';
          heart.style.top = startY + 'px';
          heart.style.fontSize = (20 + Math.random() * 40) + 'px';
          heart.style.animationDuration = (1 + Math.random() * 0.5) + 's';
          
          document.body.appendChild(heart);
          setTimeout(() => heart.remove(), 1500);
        }, i * 30);
      }
    }

    function createBackgroundHearts() {
      const heartSymbols = ['💗', '💖', '💕', '💓', '🌸'];
      
      for (let i = 0; i < 25; i++) {
        const heart = document.createElement('div');
        heart.className = 'float-heart';
        heart.innerHTML = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
        heart.style.left = Math.random() * 100 + '%';
        heart.style.animationDuration = (10 + Math.random() * 20) + 's';
        heart.style.animationDelay = Math.random() * 10 + 's';
        heart.style.fontSize = (15 + Math.random() * 35) + 'px';
        heart.style.opacity = 0.3 + Math.random() * 0.4;
        elements.heartBg.appendChild(heart);
      }
    }

    function createSparkles(x, y) {
      for (let i = 0; i < 8; i++) {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        sparkle.style.left = x + 'px';
        sparkle.style.top = y + 'px';
        sparkle.style.transform = `rotate(${Math.random() * 360}deg)`;
        document.body.appendChild(sparkle);
        setTimeout(() => sparkle.remove(), 1000);
      }
    }

    function createConfetti() {
      const colors = ['#ff4d6d', '#ffb3c6', '#ff8eb5', '#ffd1dc', '#fff0f3'];
      
      for (let i = 0; i < 100; i++) {
        setTimeout(() => {
          const confetti = document.createElement('div');
          confetti.className = 'confetti';
          confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          confetti.style.left = Math.random() * 100 + '%';
          confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
          confetti.style.width = (5 + Math.random() * 10) + 'px';
          confetti.style.height = (5 + Math.random() * 10) + 'px';
          confetti.style.animation = `floatAround ${3 + Math.random() * 4}s linear forwards`;
          confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
          document.body.appendChild(confetti);
          setTimeout(() => confetti.remove(), 7000);
        }, i * 20);
      }
    }

    // ===== INTERACTIVE ELEMENTS =====
    function wiggleEnvelope() {
      const envelope = document.querySelector('.envelope-icon');
      envelope.style.animation = 'none';
      setTimeout(() => {
        envelope.style.animation = 'envelopeFloat 0.5s ease-in-out 3';
      }, 10);
      createSparkles(window.innerWidth/2, window.innerHeight/2);
    }

    function celebrateGif(element) {
      element.style.transform = 'scale(1.2)';
      setTimeout(() => {
        element.style.transform = '';
      }, 300);
      explodeHearts(10);
    }

    function roseClick(element) {
      element.style.transform = 'scale(1.5) rotate(360deg)';
      setTimeout(() => {
        element.style.transform = '';
      }, 600);
      createSparkles(
        element.getBoundingClientRect().left + 40,
        element.getBoundingClientRect().top + 40
      );
    }

    // ===== MUSIC CONTROL =====
    function toggleMusic() {
      if (state.isPlaying) {
        elements.music.pause();
        elements.musicBtn.innerHTML = '🎵';
        elements.musicBtn.classList.remove('playing');
        elements.volumeControl.classList.remove('show');
      } else {
        elements.music.volume = CONFIG.musicVolume;
        elements.music.play().catch(e => {
          console.log('Audio play failed:', e);
          alert('Click again to enable music! 🎵');
        });
        elements.musicBtn.innerHTML = '🎶';
        elements.musicBtn.classList.add('playing');
        elements.volumeControl.classList.add('show');
      }
      state.isPlaying = !state.isPlaying;
    }

    function changeVolume(value) {
      const volume = value / 100;
      elements.music.volume = volume;
      CONFIG.musicVolume = volume;
    }

    // Hide volume when clicking outside
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.music-control') && !e.target.closest('.volume-control')) {
        elements.volumeControl.classList.remove('show');
      }
    });

    // ===== KEYBOARD SUPPORT =====
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !state.yesClicked) {
        handleYes();
      }
      if (e.key === 'm' || e.key === 'M') {
        toggleMusic();
      }
    });

    // ===== PREVENT ZOOM ON DOUBLE TAP =====
    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, false);
  </script>
</body>
</html>
