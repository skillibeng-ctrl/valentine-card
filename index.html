<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>a letter · slowly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
        /* ── reset & base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-font-smoothing: antialiased;
        }

        :root {
            --ink: #1a1530;
            --twilight: #3d2f52;
            --rose: #f3a6c4;
            --rose-deep: #d9759f;
            --gold: #fae3c0;
            --moon: #ffe8d6;
            --paper: #fff9f4;
            --line: rgba(255, 232, 214, 0.12);
            --focus: #ffe8d6;
            --cursor-color: var(--rose);
            --glass-bg: rgba(26, 21, 48, 0.55);
            --glass-border: rgba(255, 232, 214, 0.08);
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(ellipse 120% 80% at 50% -10%, #2a2042 0%, var(--ink) 55%, #0f0b1c 100%);
            color: var(--paper);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }

        /* ── soft glow behind card ── */
        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 600px;
            height: 600px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(243, 166, 196, 0.10) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: pulseGlow 6s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.6;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.15);
                opacity: 1;
            }
        }

        /* ── starfield ── */
        .stars {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .star {
            position: absolute;
            border-radius: 50%;
            background: var(--paper);
            opacity: var(--o, 0.6);
            animation: twinkle var(--dur, 4s) ease-in-out infinite;
            animation-delay: var(--delay, 0s);
        }

        @keyframes twinkle {
            0%,
            100% {
                opacity: calc(var(--o, 0.6) * 0.25);
            }
            50% {
                opacity: var(--o, 0.6);
            }
        }

        /* ── Floating Petals ── */
        .petals-container {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            bottom: -30px;
            width: 14px;
            height: 18px;
            background: var(--rose);
            border-radius: 40% 0 40% 40%;
            opacity: 0;
            transform-origin: center;
            will-change: transform, opacity;
            animation: floatPetal linear infinite;
            box-shadow: 0 0 12px rgba(243, 166, 196, 0.15);
        }

        .petal:nth-child(odd) {
            background: var(--moon);
            border-radius: 0 40% 40% 40%;
            box-shadow: 0 0 12px rgba(255, 232, 214, 0.10);
        }

        .petal:nth-child(3n) {
            background: var(--gold);
            border-radius: 50% 0 50% 50%;
            width: 10px;
            height: 12px;
        }

        @keyframes floatPetal {
            0% {
                transform: translateY(0) rotate(0deg) translateX(0) scale(0.6);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-110vh) rotate(720deg) translateX(80px) scale(1);
                opacity: 0;
            }
        }

        /* ── scene ── */
        .scene {
            position: relative;
            z-index: 1;
            max-width: 620px;
            width: 100%;
            animation: floatScene 8s ease-in-out infinite;
        }

        @keyframes floatScene {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        /* ── constellation ── */
        .constellation {
            position: relative;
            width: 100%;
            max-width: 440px;
            margin: 0 auto 20px;
            display: block;
            filter: drop-shadow(0 0 20px rgba(243, 166, 196, 0.15));
        }

        .constellation svg {
            width: 100%;
            display: block;
        }

        .const-line {
            fill: none;
            stroke: rgba(243, 166, 196, 0.35);
            stroke-width: 1.2;
            stroke-dasharray: 6 8;
            stroke-linecap: round;
            animation: drawLine 3.2s ease forwards;
        }

        @keyframes drawLine {
            from {
                stroke-dashoffset: 600;
                opacity: 0;
            }
            to {
                stroke-dashoffset: 0;
                opacity: 1;
            }
        }

        .const-point {
            fill: var(--moon);
            filter: drop-shadow(0 0 12px rgba(255, 232, 214, 0.8));
        }

        .const-point.you {
            animation: pulse-pt 3.2s ease-in-out infinite;
        }
        .const-point.me {
            animation: pulse-pt 3.2s ease-in-out infinite 1.6s;
        }

        @keyframes pulse-pt {
            0%,
            100% {
                r: 3.4;
                opacity: 0.8;
            }
            50% {
                r: 4.8;
                opacity: 1;
            }
        }

        .const-label {
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            letter-spacing: 0.08em;
            fill: rgba(255, 249, 244, 0.45);
            text-transform: uppercase;
            font-weight: 400;
        }

        /* ── Glass card ── */
        .card {
            padding: 8px 12px 0;
            background: var(--glass-bg);
            backdrop-filter: blur(12px) saturate(1.2);
            -webkit-backdrop-filter: blur(12px) saturate(1.2);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 28px 30px 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            transition: box-shadow 0.4s ease;
        }

        .card:hover {
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.6), 0 0 40px rgba(243, 166, 196, 0.05);
        }

        .eyebrow {
            text-align: center;
            font-size: 0.72rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(255, 249, 244, 0.35);
            margin-bottom: 28px;
            font-weight: 400;
            transition: opacity 0.6s ease;
        }

        /* ── letter wrapper (loader + letter) ── */
        .letter-wrapper {
            position: relative;
            min-height: 300px;
        }

        /* ── loader ── */
        .loader {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Fraunces', serif;
            font-size: 2.8rem;
            letter-spacing: 0.3em;
            color: rgba(255, 232, 214, 0.15);
            transition: opacity 0.9s ease;
            pointer-events: none;
            z-index: 2;
        }

        .loader.hidden {
            opacity: 0;
        }

        .loader span {
            animation: loaderPulse 1.6s ease-in-out infinite;
        }

        @keyframes loaderPulse {
            0%,
            100% {
                opacity: 0.2;
                transform: scale(1);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.05);
            }
        }

        /* ── letter ── */
        .letter {
            font-family: 'Fraunces', serif;
            font-weight: 400;
            font-size: clamp(1.05rem, 2.4vw, 1.2rem);
            line-height: 2;
            color: rgba(255, 249, 244, 0.88);
            letter-spacing: 0.004em;
            opacity: 0;
            transition: opacity 0.8s ease;
            position: relative;
            z-index: 1;
        }

        .letter.ready {
            opacity: 1;
        }

        .letter p {
            margin-bottom: 22px;
            opacity: 0;
            animation: fadeP 0.6s ease forwards;
        }

        .letter p:last-of-type {
            margin-bottom: 0;
        }

        @keyframes fadeP {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── typewriter cursor ── */
        .cursor-blink {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: var(--cursor-color);
            margin-left: 2px;
            vertical-align: text-bottom;
            border-radius: 1px;
            animation: blink 0.9s step-end infinite;
            opacity: 1;
            transition: opacity 0.3s ease;
            filter: drop-shadow(0 0 6px rgba(243, 166, 196, 0.4));
        }

        .cursor-blink.done {
            animation: none;
            opacity: 0;
        }

        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        /* ── hidden while typing ── */
        .signature,
        .divider,
        .next-link {
            opacity: 0;
            transition: opacity 0.7s ease, transform 0.5s ease;
            transform: translateY(10px);
        }

        .signature.reveal,
        .divider.reveal,
        .next-link.reveal {
            opacity: 1;
            transform: translateY(0);
        }

        .signature {
            margin-top: 40px;
            font-family: 'Fraunces', serif;
            font-style: italic;
            font-weight: 500;
            font-size: 1.35rem;
            color: var(--rose);
            letter-spacing: 0.01em;
            text-shadow: 0 0 30px rgba(243, 166, 196, 0.15);
        }

        .divider {
            width: 40px;
            height: 1.5px;
            background: var(--line);
            margin: 38px auto;
            border-radius: 2px;
        }

        .next-link {
            display: flex;
            justify-content: center;
        }

        .next-btn {
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            border: 1px solid var(--rose);
            background: transparent;
            color: var(--moon);
            padding: 12px 30px;
            border-radius: 40px;
            font-size: 0.88rem;
            font-weight: 500;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.25s ease, color 0.25s ease, transform 0.15s ease, box-shadow 0.3s ease;
            letter-spacing: 0.02em;
            backdrop-filter: blur(4px);
        }

        .next-btn:hover {
            background: var(--rose);
            color: var(--ink);
            box-shadow: 0 0 30px rgba(243, 166, 196, 0.25);
        }

        .next-btn:active {
            transform: scale(0.96);
        }

        .next-btn:focus-visible {
            outline: 2px solid var(--focus);
            outline-offset: 3px;
        }

        .next-btn .arrow {
            display: inline-block;
            transition: transform 0.25s ease;
        }

        .next-btn:hover .arrow {
            transform: translateX(4px);
        }

        /* ── Music Toggle Button ── */
        .music-toggle {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 50;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid rgba(255, 232, 214, 0.2);
            background: rgba(26, 21, 48, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: var(--moon);
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            font-family: 'Inter', sans-serif;
        }

        .music-toggle:hover {
            background: var(--rose);
            color: var(--ink);
            border-color: var(--rose);
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(243, 166, 196, 0.2);
        }

        .music-toggle:active {
            transform: scale(0.92);
        }

        .music-toggle .state-label {
            font-size: 0.6rem;
            letter-spacing: 0.05em;
            margin-left: 2px;
        }

        /* ── responsiveness ── */
        @media (max-width: 480px) {
            .card {
                padding: 20px 16px 20px;
            }
            .letter {
                font-size: 1rem;
                line-height: 1.9;
            }
            .letter p {
                margin-bottom: 18px;
            }
            .signature {
                font-size: 1.2rem;
                margin-top: 32px;
            }
            .constellation {
                max-width: 320px;
                margin-bottom: 12px;
            }
            .next-btn {
                padding: 10px 22px;
                font-size: 0.82rem;
            }
            .loader {
                font-size: 2.2rem;
            }
            .petal {
                width: 10px;
                height: 14px;
            }
            .music-toggle {
                bottom: 20px;
                right: 20px;
                width: 44px;
                height: 44px;
                font-size: 1rem;
            }
        }

        @media (max-width: 380px) {
            .letter {
                font-size: 0.92rem;
            }
            .constellation {
                max-width: 260px;
            }
            .card {
                padding: 16px 12px;
            }
        }
    </style>
</head>
<body>

    <!-- ─── ambient glow ─── -->
    <div class="ambient-glow"></div>

    <!-- ─── stars ─── -->
    <div class="stars" id="stars"></div>

    <!-- ─── floating petals ─── -->
    <div class="petals-container" id="petals"></div>

    <!-- ─── Music (your MP3) ─── -->
    <audio id="bgMusic" loop preload="auto" src="/videoplayback.mp3"></audio>

    <!-- ─── Music Toggle ─── -->
    <button class="music-toggle" id="musicToggle" aria-label="Toggle ambient music">
        <span id="musicIcon">♪</span>
    </button>

    <!-- ─── scene ─── -->
    <div class="scene">

        <!-- constellation -->
        <div class="constellation" aria-hidden="true">
            <svg viewBox="0 0 420 150">
                <path class="const-line" d="M 55 110 Q 210 18 365 100" />
                <circle class="const-point you" cx="55" cy="110" r="3.4" />
                <circle class="const-point me" cx="365" cy="100" r="3.4" />
                <text class="const-label" x="55" y="134" text-anchor="middle">you</text>
                <text class="const-label" x="365" y="124" text-anchor="middle">me</text>
            </svg>
        </div>

        <!-- card -->
        <div class="card">
            <p class="eyebrow">a letter</p>

            <div class="letter-wrapper">
                <!-- loader -->
                <div class="loader" id="loader"><span>· · ·</span></div>

                <!-- letter -->
                <div class="letter" id="letter"></div>
            </div>

           
            <div class="divider" id="divider"></div>
            <div class="next-link" id="nextLink">
                <a class="next-btn" href="secret.html">
                    There's a bit more
                    <span class="arrow">→</span>
                </a>
            </div>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ─── stars ──────────────────────────────────────────
            function createStars() {
                const container = document.getElementById('stars');
                const count = window.innerWidth < 600 ? 45 : 75;
                for (let i = 0; i < count; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    const size = (Math.random() * 1.8 + 0.8).toFixed(2);
                    star.style.setProperty('--s', `${size}px`);
                    star.style.width = `${size}px`;
                    star.style.height = `${size}px`;
                    star.style.setProperty('--o', (Math.random() * 0.5 + 0.3).toFixed(2));
                    star.style.setProperty('--dur', `${(Math.random() * 4 + 3).toFixed(1)}s`);
                    star.style.setProperty('--delay', `${(Math.random() * 5).toFixed(1)}s`);
                    star.style.left = `${Math.random() * 100}%`;
                    star.style.top = `${Math.random() * 100}%`;
                    container.appendChild(star);
                }
            }
            createStars();

            // ─── petals ──────────────────────────────────────────
            function createPetals() {
                const container = document.getElementById('petals');
                const count = window.innerWidth < 600 ? 10 : 18;
                for (let i = 0; i < count; i++) {
                    const petal = document.createElement('div');
                    petal.className = 'petal';
                    const size = 10 + Math.random() * 14;
                    petal.style.width = `${size}px`;
                    petal.style.height = `${size * 1.3}px`;
                    petal.style.left = `${Math.random() * 100}%`;
                    petal.style.animationDuration = `${12 + Math.random() * 18}s`;
                    petal.style.animationDelay = `${Math.random() * 20}s`;
                    petal.style.opacity = '0';
                    container.appendChild(petal);
                }
            }
            createPetals();

            // ─── LETTER TYPING ENGINE ──────────────────────────
            const paragraphs = [
                'Hey —',
                'I know we don\'t talk every day, and this might land a little out of nowhere. But I\'ve been meaning to write this for a while, so here it is, plainly.',
                'I really enjoy our conversations, even the small ones. There\'s something calm about talking to you. Something genuine. It tends to stay with me longer than I think you realize.',
                'I\'m not writing this to ask for anything or to rush anything. I just wanted to say it honestly: whether it\'s late-night talks, random check-ins, or just the occasional message across the distance, I\'ve liked getting to know you.',
                'That\'s really it. No question attached, no response required. I just wanted you to know.'
            ];

            const letterEl = document.getElementById('letter');
            const signatureEl = document.getElementById('signature');
            const dividerEl = document.getElementById('divider');
            const nextLinkEl = document.getElementById('nextLink');
            const loaderEl = document.getElementById('loader');

            const pElements = [];
            paragraphs.forEach((text) => {
                const p = document.createElement('p');
                p.dataset.fullText = text;
                p.textContent = '';
                letterEl.appendChild(p);
                pElements.push(p);
            });

            let currentP = 0;
            let currentChar = 0;
            let isComplete = false;
            let timeoutId = null;
            let cursorSpan = null;

            function getCursor() {
                if (!cursorSpan) {
                    cursorSpan = document.createElement('span');
                    cursorSpan.className = 'cursor-blink';
                }
                return cursorSpan;
            }

            function detachCursor() {
                if (cursorSpan && cursorSpan.parentNode) {
                    cursorSpan.parentNode.removeChild(cursorSpan);
                }
            }

            function attachCursor(pEl) {
                detachCursor();
                const cursor = getCursor();
                pEl.appendChild(cursor);
            }

            function typeChar() {
                if (isComplete) return;
                if (currentP >= pElements.length) {
                    finishTyping();
                    return;
                }

                const p = pElements[currentP];
                const full = p.dataset.fullText;

                if (currentChar >= full.length) {
                    p.textContent = full;
                    detachCursor();
                    currentP++;
                    currentChar = 0;

                    if (currentP < pElements.length) {
                        const nextP = pElements[currentP];
                        attachCursor(nextP);
                        nextP.style.animation = 'none';
                        void nextP.offsetHeight;
                        nextP.style.animation = 'fadeP 0.5s ease forwards';
                        timeoutId = setTimeout(typeChar, 45 + Math.random() * 35);
                    } else {
                        finishTyping();
                    }
                    return;
                }

                const nextChar = full[currentChar];
                const display = full.substring(0, currentChar + 1);
                p.textContent = display;
                attachCursor(p);
                currentChar++;

                let delay = 38 + Math.random() * 28;
                if ('.!?,;:'.includes(nextChar)) delay += 60;
                if (nextChar === ' ') delay += 10;
                if (nextChar === '\n') delay += 120;

                timeoutId = setTimeout(typeChar, delay);
            }

            function finishTyping() {
                if (isComplete) return;
                isComplete = true;

                pElements.forEach(p => {
                    p.textContent = p.dataset.fullText;
                });

                detachCursor();
                if (cursorSpan) {
                    cursorSpan.classList.add('done');
                }

                setTimeout(() => signatureEl.classList.add('reveal'), 200);
                setTimeout(() => dividerEl.classList.add('reveal'), 450);
                setTimeout(() => nextLinkEl.classList.add('reveal'), 700);
            }

            function startTyping() {
                if (pElements.length > 0) {
                    const firstP = pElements[0];
                    firstP.style.animation = 'none';
                    void firstP.offsetHeight;
                    firstP.style.animation = 'fadeP 0.5s ease forwards';
                    attachCursor(firstP);
                }
                timeoutId = setTimeout(typeChar, 380);
            }

            // ─── init with loader ─────────────────────────────
            function init() {
                setTimeout(() => {
                    loaderEl.classList.add('hidden');
                    letterEl.classList.add('ready');
                    setTimeout(() => {
                        startTyping();
                    }, 400);
                }, 1800);
            }

            // ─── visibility change ────────────────────────────
            let wasHidden = false;
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    wasHidden = true;
                    if (timeoutId) {
                        clearTimeout(timeoutId);
                        timeoutId = null;
                    }
                } else if (wasHidden && !isComplete) {
                    wasHidden = false;
                    if (!timeoutId) {
                        timeoutId = setTimeout(typeChar, 200);
                    }
                }
            });

            // ─── MUSIC (your MP3) ──────────────────────────────
            const audioEl = document.getElementById('bgMusic');
            const musicToggle = document.getElementById('musicToggle');
            const musicIcon = document.getElementById('musicIcon');

            // Set initial icon to paused state
            musicIcon.textContent = '♪';

            function toggleMusic() {
                if (audioEl.paused) {
                    // Try to play (browser may require user gesture)
                    audioEl.play().then(() => {
                        musicIcon.textContent = '♫';
                    }).catch(err => {
                        // If autoplay is blocked, the button will still work on next click
                        console.warn('Audio play failed:', err);
                    });
                } else {
                    audioEl.pause();
                    musicIcon.textContent = '♪';
                }
            }

            musicToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleMusic();
            });

            // If the audio ends, loop it (but we have loop attribute)
            // Also handle when the audio is loaded and ready
            audioEl.addEventListener('canplaythrough', () => {
                // The audio is ready to play
            });

            // ─── GO ──────────────────────────────────────────
            init();

            window.addEventListener('beforeunload', () => {
                if (timeoutId) clearTimeout(timeoutId);
                if (audioEl) {
                    audioEl.pause();
                    audioEl.currentTime = 0;
                }
            });

        })();
    </script>
</body>
</html>
