<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>a little something for you ✨</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #f9c9d6 0%, #ffdde1 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      margin: 0;
      transition: background 0.5s ease;
    }

    /* soft floaty container */
    .valentine-card {
      max-width: 800px;
      width: 100%;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 48px 48px 40px 40px;
      box-shadow: 0 25px 40px -10px rgba(250, 100, 150, 0.4), 0 0 0 1px rgba(255, 220, 230, 0.5) inset;
      padding: 40px 30px 50px;
      text-align: center;
      transition: all 0.4s;
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 600;
      background: linear-gradient(135deg, #b3406c, #d45e8b, #ff8eb5);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
      text-shadow: 0 5px 15px rgba(255, 150, 200, 0.3);
    }

    .sub {
      font-size: 1.25rem;
      color: #a64d79;
      margin-bottom: 30px;
      font-weight: 300;
      background: rgba(255, 220, 240, 0.7);
      display: inline-block;
      padding: 8px 24px;
      border-radius: 60px;
      backdrop-filter: blur(4px);
    }

    .button-pair {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      flex-wrap: wrap;
      margin: 40px 0 25px;
      position: relative;
    }

    .yes-btn {
      background: #ff4d6d;
      color: white;
      border: none;
      padding: 16px 50px;
      font-size: 1.8rem;
      font-weight: 600;
      border-radius: 50px;
      box-shadow: 0 15px 25px -5px #ff99bb, 0 4px 0 0 #b32e4a;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 1px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .yes-btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 22px 30px -5px #ff99bb, 0 6px 0 0 #b32e4a;
      background: #ff3355;
    }

    .yes-btn:active {
      transform: translateY(4px);
      box-shadow: 0 8px 15px -5px #ff99bb, 0 2px 0 0 #b32e4a;
    }

    .no-btn {
      background: #f0f0f0;
      color: #888;
      border: 2px solid #ffb3c6;
      padding: 12px 35px;
      font-size: 1.5rem;
      font-weight: 500;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 0 0 #d9d9d9;
      transition: 0.1s ease;
      position: relative;
    }

    /* shy no button – runs away on hover/touch */
    .no-btn:hover {
      background: #ffe2e8;
      color: #a15c6e;
      border-color: #ff9eb5;
    }

    /* surprise section (hidden at first) */
    .surprise-box {
      margin-top: 35px;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.5s ease;
      pointer-events: none;
    }

    .surprise-box.reveal {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .love-message {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(10px);
      padding: 30px 25px;
      border-radius: 50px 50px 30px 30px;
      font-size: 1.4rem;
      line-height: 1.7;
      color: #552e3c;
      text-align: left;
      white-space: pre-line;
      box-shadow: 0 10px 20px rgba(255, 190, 200, 0.5);
      margin: 30px 0 30px;
      border: 1px solid white;
    }

    .gif-gallery {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      margin: 35px 0 20px;
    }

    .gif-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .gif-label {
      font-size: 1.2rem;
      color: #a14b6e;
      background: rgba(255,255,240,0.6);
      padding: 4px 16px;
      border-radius: 40px;
      backdrop-filter: blur(2px);
    }

    /* BIGGER GIFS - both larger and more prominent */
    .bear-img {
      width: 260px;        /* significantly bigger */
      max-width: 90%;
      border-radius: 160px;
      box-shadow: 0 20px 28px #ff9eb5;
      border: 4px solid white;
      transition: 0.3s ease;
      display: block;
    }

    .bear-img:hover {
      transform: scale(1.05) rotate(1deg);
      box-shadow: 0 25px 35px #ff85a8;
    }

    /* second gif - hugging bear, also big */
    .hug-bear-img {
      width: 280px;        /* even bigger for the hugging one */
      max-width: 90%;
      border-radius: 160px;
      box-shadow: 0 20px 28px #ff9eb5;
      border: 4px solid white;
      transition: 0.3s ease;
      display: block;
    }

    .hug-bear-img:hover {
      transform: scale(1.05) rotate(-1deg);
      box-shadow: 0 25px 35px #ff85a8;
    }

    .rose-emoji-large {
      font-size: 4.8rem;
      filter: drop-shadow(0 8px 10px #ff9eb5);
      animation: gentleSway 3s infinite ease-in-out;
      line-height: 1;
    }

    /* keyframes */
    @keyframes gentleSway {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(6deg) scale(1.05); }
      100% { transform: rotate(0deg); }
    }

    @keyframes floatAround {
      0% { transform: translateY(110vh) rotate(0deg); opacity: 0.5; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    @keyframes popOut {
      0% { transform: scale(0.2) rotate(0deg); opacity: 1; }
      70% { transform: scale(1.5) rotate(20deg); opacity: 0.8; }
      100% { transform: scale(2) rotate(40deg); opacity: 0; }
    }

    /* floating hearts background */
    .heart-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }

    .float-heart {
      position: absolute;
      font-size: 20px;
      color: #ffb3c6;
      animation: floatAround 14s linear infinite;
      opacity: 0.5;
      user-select: none;
    }

    /* big heart explosion (ephemeral) */
    .explode-heart {
      position: fixed;
      font-size: 2rem;
      animation: popOut 1.5s ease-out forwards;
      z-index: 999;
      pointer-events: none;
    }

    .hint-text {
      font-size: 1rem;
      color: #b36b7e;
      margin-top: 20px;
      opacity: 0.7;
    }

    /* make no button move on desktop */
    @media (hover: hover) {
      .no-btn {
        transition: left 0.1s ease, top 0.1s ease, transform 0.2s;
      }
    }

    @media (max-width: 600px) {
      .bear-img, .hug-bear-img {
        width: 200px;      /* still big on mobile */
      }
      .love-message {
        font-size: 1.2rem;
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- background floating soft hearts -->
  <div class="heart-bg" id="heartBg"></div>

  <!-- main card -->
  <div class="valentine-card">
    <h1>Heyyy, guess what? 🌸</h1>
    <div class="sub">(something i've been meaning to ask...)</div>

    <!-- question & buttons -->
    <div style="font-size: 2rem; margin-bottom: 5px;">💌</div>
    <p style="font-size: 1.8rem; font-weight: 400; color: #773d54;">Will you be my Valentine?</p>
    <p style="color:#b85c7c; margin-bottom: 10px;">(no pressure, just a hopeful click)</p>

    <div class="button-pair" id="buttonPair">
      <button class="yes-btn" id="yesBtn">Yes 💖</button>
      <button class="no-btn" id="noBtn">No 😅</button>
    </div>

    <!-- surprise area (hidden initially) with BIG gifs -->
    <div class="surprise-box" id="surpriseBox">
      <div class="love-message" id="letterDisplay"></div>

      <!-- Two GIFs displayed side by side, both enlarged -->
      <div class="gif-gallery">
        <div class="gif-item">
          <span class="gif-label">bear hug 💞</span>
          <!-- FIRST GIF (your new one - hugging bear) big -->
          <img class="hug-bear-img" src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExNzZ5Z253bnNmejRkb3ZmcHRlZHVpMnZneTd2MGJpdGQ3Nzg1d2ljMyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/Wopg1mZqst26bQYdMK/giphy.gif" alt="hugging bear love">
        </div>

        <div class="gif-item">
          <span class="gif-label">teddy love 🌹</span>
          <!-- SECOND GIF (original teddy) also big -->
          <img class="bear-img" src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExaGs2NW13bnEwa3pkOXN3bHZ1czZveW1uOGs3YjU4cGtvYmxiNjV5biZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/zFHu7yuSHm4H5gNZVx/giphy.gif" alt="teddy bear love">
        </div>
      </div>

      <!-- extra rose flair -->
      <div style="display: flex; justify-content: center; gap: 10px; margin: 10px 0;">
        <span class="rose-emoji-large">🌹</span>
        <span class="rose-emoji-large">🌸</span>
        <span class="rose-emoji-large">🌹</span>
      </div>
      <p style="margin-top: 20px; font-size: 1.4rem; color:#ab4f71;">💘 you just made my day 💘</p>
    </div>

    <div class="hint-text" id="hintMsg">(the "No" button is shy, don't be mad ☁️)</div>
  </div>

  <script>
    (function() {
      // ---- friendly message (personal, not too intense, just sweet) ----
      const message = `Hi there, beautiful soul 💫

I know we don’t chat a lot, and this might be a little unexpected,
but I wanted to do something small & genuine for you.

Even though we’re miles apart, you always manage to bring a smile to my day.
You seem like someone with a really kind heart, and I’d love to get to know you better —
over a silly Valentine’s chat, a coffee when we can, or just some laughs from afar.

So here’s my honest question (with a tiny digital rose 🌹):

Will you be my Valentine?
(No pressure — just a chance to connect, even across the distance.)

Either way, I hope today brings you a little joy and a big smile. 💕

      // ---- DOM elements ----
      const yesBtn = document.getElementById('yesBtn');
      const noBtn = document.getElementById('noBtn');
      const surpriseBox = document.getElementById('surpriseBox');
      const letterDisplay = document.getElementById('letterDisplay');
      const hintMsg = document.getElementById('hintMsg');
      const buttonPair = document.getElementById('buttonPair');

      // ---- flag to avoid double explosion ----
      let yesClicked = false;

      // ---- typewriter effect ----
      function typeWriterLineByLine(text, element, speed = 30) {
        let i = 0;
        element.innerHTML = ''; 
        function write() {
          if (i < text.length) {
            if (text.charAt(i) === '\n') {
              element.innerHTML += '<br>';
            } else {
              element.innerHTML += text.charAt(i);
            }
            i++;
            setTimeout(write, speed);
          }
        }
        write();
      }

      // ---- heart explosion (more intense) ----
      function explodeHearts(count = 45) {
        for (let i = 0; i < count; i++) {
          const heart = document.createElement('div');
          heart.className = 'explode-heart';
          heart.innerHTML = ['💖','💗','💓','💕','💘','🌸','🌺','💞'][Math.floor(Math.random() * 8)];
          heart.style.left = Math.random() * 100 + '%';
          heart.style.top = Math.random() * 100 + '%';
          heart.style.fontSize = (24 + Math.random() * 48) + 'px';
          heart.style.animationDuration = (1 + Math.random()) + 's';
          heart.style.position = 'fixed';
          document.body.appendChild(heart);
          setTimeout(() => heart.remove(), 1500);
        }
      }

      // ---- background floating hearts generator ----
      function createBackgroundHearts() {
        const bg = document.getElementById('heartBg');
        for (let i = 0; i < 20; i++) {
          const heart = document.createElement('div');
          heart.className = 'float-heart';
          heart.innerHTML = '💗';
          heart.style.left = Math.random() * 100 + '%';
          heart.style.animationDuration = (8 + Math.random() * 15) + 's';
          heart.style.animationDelay = (Math.random() * 10) + 's';
          heart.style.fontSize = (15 + Math.random() * 30) + 'px';
          bg.appendChild(heart);
        }
      }
      createBackgroundHearts();

      // ---- "NO" button escape logic ----
      if (window.matchMedia("(hover: hover)").matches) {
        // desktop: move on mouseover
        noBtn.addEventListener('mouseover', function(e) {
          if (yesClicked) return;
          const container = document.querySelector('.valentine-card').getBoundingClientRect();
          const btnRect = noBtn.getBoundingClientRect();
          const maxX = container.width - btnRect.width - 20;
          const maxY = container.height - btnRect.height - 80; 
          const randomX = Math.min(maxX, Math.max(10, Math.random() * maxX));
          const randomY = Math.min(maxY, Math.max(20, Math.random() * maxY));

          noBtn.style.position = 'absolute';
          noBtn.style.left = randomX + 'px';
          noBtn.style.top = randomY + 'px';
          noBtn.style.transform = 'scale(0.95)';
          setTimeout(() => noBtn.style.transform = 'scale(1)', 150);
        });
      } else {
        noBtn.addEventListener('touchstart', function(e) {
          e.preventDefault();
          if (yesClicked) return;
          const container = document.querySelector('.valentine-card').getBoundingClientRect();
          const btnRect = noBtn.getBoundingClientRect();
          const maxX = container.width - btnRect.width - 20;
          const maxY = container.height - btnRect.height - 80;
          const randomX = Math.min(maxX, Math.max(10, Math.random() * maxX));
          const randomY = Math.min(maxY, Math.max(20, Math.random() * maxY));
          noBtn.style.position = 'absolute';
          noBtn.style.left = randomX + 'px';
          noBtn.style.top = randomY + 'px';
        }, {passive: false});
      }

      // ---- Yes button click ----
      yesBtn.addEventListener('click', function() {
        if (yesClicked) return;
        yesClicked = true;

        noBtn.style.opacity = '0';
        noBtn.style.pointerEvents = 'none';
        hintMsg.style.opacity = '0';
        hintMsg.style.transition = '0.3s';

        yesBtn.style.transform = 'scale(1.1)';
        yesBtn.style.background = '#ff2255';
        yesBtn.innerText = 'yay! 💘';

        surpriseBox.classList.add('reveal');

        typeWriterLineByLine(message, letterDisplay, 30);

        explodeHearts(50);

        document.body.style.background = 'linear-gradient(145deg, #ffe2ec, #ffb3d1)';

        setTimeout(() => explodeHearts(30), 400);
        setTimeout(() => explodeHearts(20), 900);
      });

      // ---- if No gets clicked ----
      noBtn.addEventListener('click', function(e) {
        if (yesClicked) return;
        e.stopPropagation();
        alert("hehe the button ran away! 😋 but seriously, you can click Yes whenever ✨");
        const container = document.querySelector('.valentine-card').getBoundingClientRect();
        const btnRect = noBtn.getBoundingClientRect();
        const maxX = container.width - btnRect.width - 20;
        const maxY = container.height - btnRect.height - 80;
        const randomX = Math.min(maxX, Math.max(10, Math.random() * maxX));
        const randomY = Math.min(maxY, Math.max(20, Math.random() * maxY));
        noBtn.style.position = 'absolute';
        noBtn.style.left = randomX + 'px';
        noBtn.style.top = randomY + 'px';
      });

    })();
  </script>

  <style>
    @media (max-width: 500px) {
      h1 { font-size: 2rem; }
      .yes-btn { padding: 14px 30px; font-size: 1.5rem; }
      .no-btn { padding: 10px 20px; font-size: 1.2rem; }
    }
  </style>
</body>
</html>
