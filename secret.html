<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>thinking of you ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #ffeef8 0%, #ffe0ec 50%, #ffd4e5 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      padding: 50px 40px;
      border-radius: 30px;
      text-align: center;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(255, 150, 180, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.8);
      position: relative;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .moon {
      font-size: 4rem;
      margin-bottom: 20px;
      display: block;
      animation: glow 3s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 10px #ffd700); }
      50% { filter: drop-shadow(0 0 25px #ff69b4); }
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.8rem;
      color: #d63384;
      margin-bottom: 25px;
      line-height: 1.2;
    }

    .message {
      color: #6c757d;
      font-size: 1.1rem;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    .distance {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      padding: 20px;
      border-radius: 20px;
      margin: 25px 0;
      color: white;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .hearts {
      font-size: 1.8rem;
      letter-spacing: 10px;
      margin-top: 20px;
      animation: heartbeat 1.5s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    /* floating stars */
    .stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }

    .star {
      position: absolute;
      color: rgba(255, 255, 255, 0.8);
      font-size: 1.2rem;
      animation: twinkle 3s infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
  </style>
</head>
<body>

  <div class="stars" id="stars"></div>

  <div class="card">
    <span class="moon">🌙</span>
    <h1>Even though we're miles apart...</h1>
    
    <p class="message">
      I look up at the same moon<br>
      and wonder if you're looking too.<br><br>
      We've never met,<br>
      but you make my days brighter<br>
      just by being you.
    </p>

    <div class="distance">
      "Distance means so little<br>
      when someone means so much"<br><br>
      💌 someday, somewhere
    </div>

    <div class="hearts">💕 💕 💕</div>
  </div>

  <script>
    // gentle stars
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 30; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.innerHTML = '✨';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 3 + 's';
      star.style.fontSize = (0.8 + Math.random() * 0.8) + 'rem';
      starsContainer.appendChild(star);
    }

    // card tilt on mouse move
    const card = document.querySelector('.card');
    document.addEventListener('mousemove', (e) => {
      const x = (window.innerWidth / 2 - e.pageX) / 50;
      const y = (window.innerHeight / 2 - e.pageY) / 50;
      card.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
    });
  </script>

</body>
</html>
